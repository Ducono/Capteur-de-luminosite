esphome:
  name: twilight-sensor
  friendly_name: Twilight sensor

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "cWKUmA1up2Us6WrHdSzFemARTcQELgbsy/tlEV4X+Qo="

ota:
  - platform: esphome
    password: "254h611a96a0eb2890b162a1bd499c89"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Twilight-Sensor Fallback Hotspot"
    password: "23gmh5WAd1K54O"

captive_portal:

#   1.  VCC   Red     (Connect to 3.3V or 5V)
#   2.  SDL   Brown   (Connect to SCL pin 9)
#   3.  DAT   White   (connect to SDA pin 8)
#   4.  GND   Black   (Connect to ground)
#   5.  ADRR  Yellow  (not used)


# Add your latitude and longtde location for platform sun
sun:
  latitude: 52.242950°
  longitude: 5.374990°


time:
  - platform: homeassistant

switch:
  - platform: restart
    name: Reboot Twilight-sensor

i2c:
  sda: 8
  scl: 9
  scan: true
  id: bus_a

sensor:
  - platform: bh1750
    id: lux
    name: "Lux"
    address: 0x23
    update_interval: 10s
    device_class: "illuminance"
    state_class: "measurement"
    filters:
      - median:
          window_size: 5    


  - platform: wifi_signal
    name: WiFi Signal Twilight-sensor 
    update_interval: 60s

  - platform: sun
    id: sun_elevation
    name: Sun Elevation
    type: elevation

binary_sensor:
  - platform: status
    name: "Twilight-sensor"

  - platform: template
    name: "Livingroom switch"
    filters:
     - delayed_off: 100s   # If ON, the return to OFF wil be delayed for 1 hour to prevent unwanted ON/OFF toggeling while sunset,clouds etc. 
     - delayed_on: 120s    # delay 2 minutes
    lambda: |-
      if ((id(lux).state > 50) and (id(sun_elevation).state > 5) or (id(sun_elevation).state > 15)) {
        // Livingroom lights off
        return false;
      } else {
        // Livingroom lights on
        return true;
      }
  
  - platform: template
    name: "Garden switch"
    filters:
      - delayed_off: 120s #2 minutes
      - delayed_on: 300s #5 minutes
    lambda: |-
      if ((id(lux).state < 5) and (id(sun_elevation).state < 0))   {
        // Garden lights on
        return true;
      } else {
        // Garden lights off
        return false;
      }

status_led:
  pin:
    number: GPIO2
    inverted: no  

